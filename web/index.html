<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Financeiro</title>
<script>
  /* Tema antes do primeiro desenho, para a tela nao piscar: escolha salva ou a do sistema. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("wd.tema"); } catch (e) {}
    if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="/"><span class="mark" aria-hidden="true"></span><span class="word"><em>Dashboard</em> Financeiro</span></a>
    <span id="sub">carregando</span>
    <div class="tools">
      <select id="f-classe" title="Filtrar por classe"></select>
      <select id="f-tipo" title="Filtrar por tipo de produto"></select>
      <button id="b-priv" class="ghost" title="Oculta valores em reais e mantém percentuais">Privacidade</button>
      <button id="b-tema" class="ghost" title="Alterna entre modo claro e modo escuro">Tema</button>
      <button id="b-xlsx" class="ghost" title="Baixa um relatório em planilha">Exportar</button>
      <button id="b-print" class="ghost" title="Imprime ou salva em PDF a tela atual">Imprimir</button>
      <button id="b-cfg" class="ghost" title="Pasta de dados">Configurações</button>
      <span id="sync" class="sync" title="Sincronização com a pasta de dados"></span>
    </div>
  </div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main id="view"></main>
<footer id="foot"></footer>

<aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-in" id="drawer-in"></div></aside>
<div id="modal" class="modal" aria-hidden="true"><div class="modal-in" id="modal-in"></div></div>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
