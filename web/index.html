<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Financeiro</title>
<script>
  /* Tema antes do primeiro desenho, para a tela nao piscar: escolha salva ou a do sistema. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("wd.tema"); } catch (e) {}
    if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#view">Pular para o conteúdo</a>
<header class="top" id="top">
  <div class="top-in">
    <button class="brand" id="b-home" title="Ir para a visão geral"><span class="mark" aria-hidden="true"></span><span class="word"><em>Dashboard</em> Financeiro</span></button>
    <nav id="tabs" role="tablist" aria-label="Seções do painel"></nav>
    <div class="tools">
      <button id="b-sync" class="status" title="Sincronizado com a pasta de dados. Clique para recarregar agora."><span id="sync" class="sync"></span><span id="sub">Carregando</span></button>
      <button id="b-priv" class="tool" aria-pressed="false"></button>
      <button id="b-tema" class="tool"></button>
      <div class="menu-wrap">
        <button id="b-menu" class="tool" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" title="Exportar, imprimir e pasta de dados"></button>
        <div id="menu" class="menu" role="menu" hidden>
          <button role="menuitem" id="b-xlsx"><span data-ic="baixar"></span><span><b>Exportar planilha</b><small>Relatório em .xlsx com posições, alocação e gastos</small></span></button>
          <button role="menuitem" id="b-print"><span data-ic="imprimir"></span><span><b>Imprimir ou salvar em PDF</b><small>A aba que está aberta</small></span></button>
          <button role="menuitem" id="b-cfg"><span data-ic="pasta"></span><span><b>Pasta de dados</b><small>De onde o painel lê e onde grava</small></span></button>
        </div>
      </div>
    </div>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<footer id="foot"></footer>

<aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-in" id="drawer-in"></div></aside>
<div id="modal" class="modal" aria-hidden="true"><div class="modal-in" id="modal-in"></div></div>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="app.js"></script>
</body>
</html>
