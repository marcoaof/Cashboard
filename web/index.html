<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cashboard</title>
<script>
  /* Tema e modo antes do primeiro desenho, para a tela nao piscar. */
  (function () {
    var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
    var skin = get("wd.skin") === "classico" ? "classico" : "moderno";
    var modo = get("wd.modo") || get("wd.tema") || "auto";
    if (modo !== "light" && modo !== "dark") modo = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-skin", skin);
    document.documentElement.setAttribute("data-theme", modo);
    /* a fonte dos visores so e baixada quando o tema classico esta em uso */
    if (skin === "classico") {
      var l = document.createElement("link");
      l.rel = "stylesheet"; l.id = "fonte-classica";
      l.href = "https://fonts.googleapis.com/css2?family=VT323&display=swap";
      document.head.appendChild(l);
    }
  })();
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="classic.css">
</head>
<body>
<a class="skip" href="#view">Pular para o conteúdo</a>
<header class="top" id="top">
  <div class="top-in">
    <button class="brand" id="b-home" title="Ir para o resumo">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 13V9M8 13V4M13 13V7"/></svg></span>
      <span class="word">Cashboard</span>
    </button>
    <nav id="tabs" role="tablist" aria-label="Seções do painel"></nav>
    <div class="tools">
      <button id="b-sync" class="status" title="O painel acompanha a sua pasta de dados. Clique para recarregar agora."><span id="sync" class="sync"></span><span id="sub">Carregando</span></button>
      <button id="b-add" class="add" data-acao="adicionar" title="Registrar um gasto, um investimento e mais"></button>
      <button id="b-priv" class="tool" aria-pressed="false"></button>
      <div class="menu-wrap">
        <button id="b-menu" class="tool" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu" title="Opções" aria-label="Opções"></button>
        <div id="menu" class="menu" role="dialog" aria-label="Opções" hidden>
          <div class="menu-tit">Opções</div>
          <div class="opt-sec">
            <div class="opt-tit" id="opt-tema">Tema</div>
            <div class="skins" role="radiogroup" aria-labelledby="opt-tema">
              <button class="skin" role="radio" data-skin="moderno"><span class="sw sw-moderno" aria-hidden="true"></span><b>Moderno</b></button>
              <button class="skin" role="radio" data-skin="classico"><span class="sw sw-classico" aria-hidden="true"></span><b>Clássico</b></button>
            </div>
          </div>
          <div class="opt-sec">
            <div class="opt-tit" id="opt-modo">Modo</div>
            <div class="seg" role="radiogroup" aria-labelledby="opt-modo">
              <button role="radio" data-modo="light">Claro</button>
              <button role="radio" data-modo="dark">Escuro</button>
              <button role="radio" data-modo="auto">Automático</button>
            </div>
          </div>
          <div class="opt-sec">
            <div class="opt-tit">Preencher com IA</div>
            <button class="opt-item" data-acao="ia"><span data-ic="ia"></span>Conectar com IA</button>
            <button class="opt-item" data-acao="importar"><span data-ic="colar"></span>Importar dados</button>
          </div>
          <div class="opt-sec">
            <div class="opt-tit">Dados</div>
            <button class="opt-item" id="b-xlsx"><span data-ic="baixar"></span>Baixar planilha (.xlsx)</button>
            <button class="opt-item" id="b-print"><span data-ic="imprimir"></span>Imprimir ou salvar em PDF</button>
            <button class="opt-item" data-acao="pasta"><span data-ic="pasta"></span>Pasta de dados</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<footer id="foot"></footer>

<aside id="drawer" class="drawer" aria-hidden="true"><div class="drawer-in" id="drawer-in"></div></aside>
<div id="modal" class="modal" aria-hidden="true"><div class="modal-in" id="modal-in"></div></div>
<div id="toast" class="toast" role="status"></div>
<div id="dica" class="dica" role="tooltip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" defer></script>
<script src="app.js" defer></script>
<script src="forms.js" defer></script>
</body>
</html>
